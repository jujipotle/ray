# config.yaml
applications:
- args:
    llm_configs:
        - model_loading_config:
            model_id: qwen-0.5b
            model_source: Qwen/Qwen2.5-0.5B-Instruct
            # model_id: opt-125m
            # model_source: facebook/opt-125m
          accelerator_type: L4
          engine_kwargs:
            enable_prefix_caching: true
          deployment_config:
            autoscaling_config:
                min_replicas: 2
                max_replicas: 2
  import_path: ray.serve.llm:build_openai_app
  name: llm_app
  route_prefix: "/"