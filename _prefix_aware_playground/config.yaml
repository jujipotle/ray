  # config.yaml
applications:
- args:
    llm_configs:
        - model_loading_config:
            model_id: qwen-0.5b
            model_source: Qwen/Qwen2.5-0.5B-Instruct
          accelerator_type: L4
          deployment_config:
            autoscaling_config:
                min_replicas: 2
                max_replicas: 2
          replica_scheduler_cls: ray.serve._private.replica_scheduler.prefix_aware_scheduler.PrefixAwareReplicaScheduler
  import_path: ray.serve.llm:build_openai_app
  name: llm_app
  route_prefix: "/"